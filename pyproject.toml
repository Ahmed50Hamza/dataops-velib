[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataops-velib"
version = "0.1.0"
description = "Daily, contract-validated Vélib' data platform"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "dbt-duckdb>=1.9,<2",
  "fastapi>=0.110,<1",
  "jsonschema>=4.21,<5",
  "prefect>=3.0,<4",
  "requests>=2.31,<3",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
